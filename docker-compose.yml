version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hrms-app
    container_name: hrms-app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-hrms}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
      - CACHE_STORE=database
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hrms-network

  web:
    image: nginx:latest
    container_name: hrms-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hrms-network

  db:
    image: mysql:8.0
    container_name: hrms-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-hrms}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: hrms-app
    container_name: hrms-queue-worker
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-hrms}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
      - CACHE_STORE=database
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - hrms-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: hrms-app
    container_name: hrms-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-hrms}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
      - CACHE_STORE=database
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - hrms-network

networks:
  hrms-network:
    driver: bridge

volumes:
  db-data:
