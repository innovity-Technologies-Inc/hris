server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;

    # Use Docker's internal DNS resolver to prevent cached IPs
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Using a variable forces Nginx to dynamically resolve the IP
        set $upstream app:9000;
        fastcgi_pass $upstream;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ^~ /minio-internal/ {
        # This ensures external users cannot access this route directly
        internal;

        # Strip the '/minio-internal/' prefix to get the true MinIO path
        rewrite ^/minio-internal/(.*)$ /$1 break;

        # Proxy directly to MinIO using the INTERNAL Docker container port (9000).
        # NOTE: 9090 is only the HOST machine's mapped port — inside Docker, MinIO listens on 9000.
        set $minio_upstream minio:9000;
        proxy_pass http://$minio_upstream;

        # Ensure MinIO receives the correct Host header (critical for S3 path-style routing)
        proxy_set_header Host minio:9000;

        # Strip client authorization headers so they don't conflict with MinIO's AWS signature
        proxy_set_header Authorization "";
        proxy_pass_request_headers off;

        # Timeouts — MinIO should respond quickly for pre-signed URLs
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Optional: Hide AWS/MinIO specific headers from the final client response
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-meta-server-side-encryption;
    }


    location ~ /\.ht {
        deny all;
    }
}
